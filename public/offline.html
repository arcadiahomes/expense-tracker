<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Offline | Arcadia Home</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f7f4; --fg: #12261b; --muted: #4b5f53; --brand: #14532d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1410; --fg: #e7f0ea; --muted: #a3b5a9; --brand: #4ade80; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 28rem; }
  h1 { font-size: 1.5rem; margin: 16px 0 8px; }
  p { color: var(--muted); }
  button { margin-top: 16px; min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0b1410; } }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" width="64" height="64" alt="">
  <h1>You're offline</h1>
  <p>This page needs a connection. Nothing you entered here has been sent or saved.</p>
  <p>If the Voice entry page was already open, any entries you kept there as unsynced drafts are still on this device and will be sent when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
